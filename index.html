<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#050507"
    />

    <meta
      name="description"
      content="NEXUS — Your futuristic gaming command center. Track games, achievements, XP, friends, and gaming activity."
    />

    <meta
      name="keywords"
      content="NEXUS, gaming dashboard, gaming command center, games, achievements, gamer profile"
    />

    <meta
      name="author"
      content="NEXUS Gaming"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="NEXUS — Gaming Command Center"
    />

    <meta
      property="og:description"
      content="Your futuristic gaming command center."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:image"
      content="/logo.svg"
    />

    <meta
      property="og:site_name"
      content="NEXUS"
    />

    <!-- Browser / Windows -->
    <meta
      name="msapplication-TileColor"
      content="#050507"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/logo.svg"
    />

    <!-- Preconnect for remote game images -->
    <link
      rel="preconnect"
      href="https://images.unsplash.com"
    />

    <title>NEXUS — Gaming Command Center</title>
  </head>

  <body>
    <noscript>
      <div
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
          background: #050507;
          color: white;
          font-family: Arial, sans-serif;
          text-align: center;
        "
      >
        <div>
          <h1>NEXUS</h1>
          <p>
            JavaScript is required to run the NEXUS Gaming Command Center.
          </p>
        </div>
      </div>
    </noscript>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
